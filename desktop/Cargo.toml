[package]
name = "optic-forge-desktop"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "zeuss-lens"
path = "src/main.rs"

[lib]
name = "optic_forge_ui"
crate-type = ["cdylib", "rlib"]

[dependencies]
vision-code-wasm = { path = ".." }
gpui-kit = "=0.7.3"
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Element", "HtmlElement", "Node", "Event"] }
