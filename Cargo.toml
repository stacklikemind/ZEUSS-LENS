[package]
name = "vision-code-wasm"
version = "0.1.0"
edition = "2021"
description = "Independent local circular optical-code encoder"

[lib]
name = "vision_code_wasm"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vision-code"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
